[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cassoulet"
version = "0.1.0"
description = "An opinionated, envelope-based import pipeline for Beancount"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "beancount>=2.3",
    "orjson>=3.10",
    "pandas",
    "openpyxl",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff",
]
fava = [
    "fava",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cassoulet"]
